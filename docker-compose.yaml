# =========================================================
# Services ================================================
# =========================================================
# Homelab landing page — a static site served by nginx.
# Routed by Traefik:
#   - home.holy-grail.ch   (public, websecure) -> Traefik/traefik/dynamic/home.yml
#   - home.fastpi.homelab  (LAN, internal)
# Also published on ${HOST_PORT} for direct LAN access without DNS or Traefik.
#
# The site is a plain HTML/CSS/JS bundle bind-mounted read-only; there is no
# build step and no backend. Editing anything under site/ takes effect on the
# next page load — no restart, no recreate.
services:
# #########################################################
# Homelab Dashboard #######################################
# #########################################################
  homelab-dashboard:
    image: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged}:${NGINX_TAG:-alpine}
    container_name: homelab-dashboard
    # Non-root (dedicated uid; the image's own 101 is a real host user, _rpc), no
    # capabilities, read-only rootfs. The sysctl lets it keep `listen 80`.
    user: "65034:65034"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    mem_limit: 128m
    env_file:
      - .env
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HOST_PORT:-8095}:80"
    networks:
      - traefik_proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 1m
      timeout: 5s
      retries: 3
      start_period: 10s

# =========================================================
# Networks ================================================
# =========================================================
networks:
  traefik_proxy:
    external: true

# =========================================================
# Volumes =================================================
# =========================================================
# (none — the site is bind-mounted read-only from ./site)
