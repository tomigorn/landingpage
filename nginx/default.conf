server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No caching for the small config/app files so edits show up immediately.
    location ~* \.(js|css|html)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
